services:
  - type: pgsql
    name: sign-lsf-db
    plan: free
  
  - type: web
    name: sign-lsf-api
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: >
      bash -lc "cd backend &&
      python init_db.py &&
      python migrate_add_favorites.py &&
      python init_challenges.py &&
      uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sign-lsf-db
          property: connectionString
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: PYTHON_VERSION
        value: "3.12.0"

