<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Signe — Pratique</title>
  <link rel="stylesheet" href="sign.css">
</head>
<body class="phone">
  <div class="screen">
    <div class="top-block">
      <header class="status">
        <a class="back" href="lesson.html">Leçon</a>
        <span class="who">Léa</span>
      </header>
      <h1 class="screen-title">Le B</h1>
    </div>
    <section class="stage compare" aria-label="Ta main à côté du modèle">
      <figure>
        <figcaption>Toi</figcaption>
        <div class="hand-frame">
          <img src="assets/b.png" alt="Ta prise du B. Le pouce est encore écarté.">
          <span class="ring"><span>Pouce</span></span>
        </div>
      </figure>
      <figure>
        <figcaption>Modèle</figcaption>
        <div class="hand-frame">
          <img src="assets/b.png" alt="Modèle du B : pouce plié sur la paume.">
        </div>
      </figure>
    </section>
    <div class="dock">
      <p class="finding">Le pouce reste écarté.</p>
      <p class="fix">Ramène-le contre la paume.</p>
      <a class="primary" href="camera.html">Réessayer</a>
      <a class="quiet" href="lesson.html">Revoir le modèle</a>
      <p class="hint">Vibration courte si c’est juste, plus longue pour réessayer.</p>
    </div>
  </div>
</body>
</html>
