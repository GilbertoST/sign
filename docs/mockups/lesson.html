<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Signe — Leçon</title>
  <link rel="stylesheet" href="sign.css">
</head>
<body class="phone">
  <div class="screen">
    <section class="stage lesson-stage">
      <header class="status">
        <a class="back" href="home.html">Accueil</a>
        <span class="who">Léa</span>
      </header>
      <h1 class="letter">B</h1>
      <img class="hero" src="assets/b.png" alt="Modèle du B : quatre doigts serrés, pouce plié sur la paume.">
      <div class="transport">
        <div class="scrub" role="img" aria-label="Le modèle est au moment où le pouce se plie">
          <div class="scrub-label">Pouce</div>
          <div class="scrub-track">
            <div class="scrub-fill"></div>
            <div class="scrub-knob"></div>
          </div>
        </div>
        <div class="controls">
          <button class="ctrl is-on" type="button" aria-pressed="true" aria-label="Vitesse lente, 0,5 fois">0,5×</button>
          <button class="ctrl" type="button" aria-pressed="false">Boucle</button>
          <button class="pause" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
          </button>
          <button class="ctrl" type="button" aria-pressed="false">Miroir</button>
          <button class="ctrl" type="button" aria-label="Changer d’angle, actuellement face" aria-pressed="false">Face</button>
        </div>
      </div>
    </section>
    <div class="dock">
      <p class="lead">Quatre doigts serrés, pouce plié sur la paume.</p>
      <a class="primary" href="camera.html">À mon tour</a>
    </div>
  </div>
</body>
</html>
